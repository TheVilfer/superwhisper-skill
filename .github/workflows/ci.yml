name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
          # macOS hosted runners are often capacity-limited; bash 3.2 coverage is best-effort.
          - os: macos-latest
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck scripts/*.sh tests/run.sh tests/fixtures/fake-superwhisper
      - name: tests
        run: tests/run.sh
      - name: SKILL.md frontmatter
        run: |
          head -1 SKILL.md | grep -qx -- '---'
          grep -q '^name: superwhisper$' SKILL.md
          grep -q '^description: ' SKILL.md
